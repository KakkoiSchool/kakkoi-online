<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kakkoi Online — rules tests</title>
  <style>
    body { font: 14px/1.6 system-ui, sans-serif; margin: 2rem; background: #1b1b22; color: #e8e8ef; }
    h1 { font-size: 1.2rem; }
    #summary { font-weight: 700; margin-bottom: 1rem; }
    .row { font-family: ui-monospace, monospace; }
    .pass { color: #7ee081; }
    .fail { color: #ff7b72; }
  </style>
</head>
<body>
  <h1>battle rules</h1>
  <p>Open this file through Live Server (not <code>file://</code>) — it loads a module.</p>
  <div id="summary">running…</div>
  <div id="rows"></div>

  <!-- No test runner, no npm. A test is a function that throws when it is unhappy;
       everything below is just enough scaffolding to print the results. -->
  <script type="module">
    import {
      actionWinner,
      MOVES, isMove, roundResult, matchWinner,
    } from '../src/battle/rules.js';

    const rows = document.querySelector('#rows');
    let passed = 0;
    let failed = 0;

    function test(name, body) {
      const row = document.createElement('div');
      row.className = 'row';
      try {
        body();
        passed++;
        row.classList.add('pass');
        row.textContent = `PASS  ${name}`;
      } catch (err) {
        failed++;
        row.classList.add('fail');
        row.textContent = `FAIL  ${name} — ${err.message}`;
      }
      rows.append(row);
    }

    function is(actual, expected, what) {
      if (actual !== expected) {
        throw new Error(`${what}: expected ${expected}, got ${actual}`);
      }
    }

    const ACTIONS = ['strike', 'block', 'charge'];

    test('the action triangle is a proper cycle', () => {
      is(actionWinner('strike', 'charge'), 1, 'strike vs charge');
      is(actionWinner('charge', 'block'), 1, 'charge vs block');
      is(actionWinner('block', 'strike'), 1, 'block vs strike');
    });

    test('the action triangle is antisymmetric, and mirrors tie', () => {
      for (const a of ACTIONS) {
        for (const b of ACTIONS) {
          if (a === b) is(actionWinner(a, b), 0, `${a} vs ${b}`);
          else is(actionWinner(a, b), -actionWinner(b, a), `${a} vs ${b}`);
        }
      }
    });

    // ---- the duel the game actually plays: three moves, first to three rounds

    test('the three moves are rock, paper and scissors, in that order', () => {
      is(MOVES.join(','), 'rock,paper,scissors', 'the buttons, left to right');
    });

    test('a round is decided by the rock-paper-scissors triangle, and says why', () => {
      is(roundResult('rock', 'scissors').winner, 'you', 'rock beats scissors');
      is(roundResult('scissors', 'paper').winner, 'you', 'scissors beats paper');
      is(roundResult('paper', 'rock').winner, 'you', 'paper beats rock');
      is(roundResult('rock', 'scissors').why, 'rock beats scissors', 'the words');
      is(roundResult('scissors', 'rock').winner, 'them', 'scissors vs rock');
      is(roundResult('scissors', 'rock').why, 'rock beats scissors', 'the words, losing');
      is(roundResult('paper', 'paper').winner, 'nobody', 'same move');
    });

    test('both players get the same answer from the same two moves', () => {
      // This is the property the whole duel rests on: nobody is in charge, so
      // the two browsers must agree without asking each other.
      for (const a of MOVES) {
        for (const b of MOVES) {
          const mine = roundResult(a, b);
          const theirs = roundResult(b, a);
          const agree = mine.winner === 'nobody' ? theirs.winner === 'nobody'
                      : mine.winner === 'you' ? theirs.winner === 'them'
                      : theirs.winner === 'you';
          is(agree, true, `${a} vs ${b} seen from both sides`);
          is(mine.why, theirs.why, `${a} vs ${b} explained the same way`);
        }
      }
    });

    test('anything that is not one of the three moves is not a move', () => {
      for (const move of MOVES) is(isMove(move), true, move);
      for (const junk of ['strike', 'lizard', 'ROCK', '', null, 3, {}, ['rock']]) {
        is(isMove(junk), false, JSON.stringify(junk));
      }
      is(roundResult('rock', 'lizard'), null, 'a made-up move gives no result');
    });

    test('the duel is over at three round wins, and not before', () => {
      is(matchWinner({ you: 2, them: 2 }, 3), null, '2–2');
      is(matchWinner({ you: 3, them: 2 }, 3), 'you', '3–2');
      is(matchWinner({ you: 0, them: 3 }, 3), 'them', '0–3');
      is(matchWinner({ you: 0, them: 0 }, 3), null, 'nothing played yet');
    });

    const summary = document.querySelector('#summary');
    summary.className = failed ? 'fail' : 'pass';
    summary.textContent = `${passed} passed, ${failed} failed`;
  </script>
</body>
</html>
