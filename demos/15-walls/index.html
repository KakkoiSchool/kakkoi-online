<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A15 — walls you cannot walk through</title>
  <style>
    body { font: 16px/1.6 system-ui, sans-serif; background: #12121a; color: #e8e8ef;
           display: grid; place-items: center; gap: 1rem; height: 100vh; margin: 0; }

    p { margin: 0; opacity: 0.7; }

  <canvas id="world" width="480" height="320"></canvas>
  <p>Arrow keys or WASD. Walk into a rock. Then walk along it.</p>
