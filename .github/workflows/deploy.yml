name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # No build step. The repo *is* the site: plain HTML and plain JavaScript,
      # published exactly as written. What runs in the browser is what is in git.
      # NOTE: the CNAME file is inert for workflow-based Pages — the custom domain
      # is set in the Pages config (gh api -X PUT .../pages -f cname=...).
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
