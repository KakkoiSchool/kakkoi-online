<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0c12">
  <title>Kakkoi Online</title>
  <!-- Installable on a phone's home screen: a manifest, an icon, and a service
       worker that caches the game so it opens with no network. See sw.js. -->
  <link rel="manifest" href="./manifest.webmanifest">
  <!-- The tab icon. Order matters: a browser that understands the SVG takes the
       first line and stays sharp on a high-density screen; older ones fall
       through to the PNGs, which are drawn on the same 16x16 grid rather than
       shrunk from the big one. See icons/ and DESIGN.md. -->
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="./icons/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <!-- The standard name first. The `apple-` one is kept beside it because older
       iOS reads only that, and Chrome warns about it alone. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kakkoi">
  <!-- One stylesheet, and it owns the whole look. There is no component
       library under it any more: a rounded, soft-shadowed one and a 16px sprite
       cannot share a screen without one of them looking like a mistake. The two
       fonts it uses are vendored beside it, so the game still opens with no
       network. -->
  <link rel="stylesheet" href="./src/ui/game.css">
</head>
<body>
  <main id="stage">
    <!-- The world fills the screen, and EVERY other thing on this page is
         positioned out of flow on top of it. That is what makes it one small app
         rather than a page with a canvas and some controls underneath — and it
         is also the only way to guarantee that a bubble, a prompt or a panel
         appearing can never move the canvas by a pixel. `src/main.js` sizes the
         canvas to this box, in whole art pixels, whenever the window changes. -->
    <div id="arena">
     <!-- #screen is exactly the canvas's box — it wraps the canvas and nothing
          else, so it is the canvas's own size at every window size, letterboxed
          or not. EVERY overlay below is positioned against this box rather than
          against the arena, which is why nothing can end up outside the world or
          off the bottom of the screen. -->
     <div id="screen">
      <!-- The world. Everything in it is drawn with canvas 2D. -->
      <canvas id="world" width="640" height="480"></canvas>

      <!-- Names and speech bubbles, in the DOM rather than painted into the
           canvas above. Positioned from the numbers the drawing already worked
           out — see src/ui/bubbles.js. Text a screen reader can reach, at the
           same scale as the rest of the interface. -->
      <div id="tags"></div>

      <!-- The UI. DOM on top of the canvas: text, buttons and dialogs are
           miserable to build on a canvas and easy in HTML. -->
      <div id="hud">
        <span id="hud-name" class="badge"></span>
        <span id="hud-place" class="badge hud-quiet"></span>
        <span id="hud-online" class="badge hud-quiet" aria-live="polite"></span>
        <span id="status" class="badge hud-quiet" aria-live="polite">starting…</span>
        <!-- When Aniki is due, and how long he stays. Worked out from the clock
             every browser already has — nobody announces him. See src/boss.js. -->
        <span id="hud-boss" class="badge hud-quiet" aria-live="off"></span>

        <!-- One control instead of four bare toggles in a row. See
             src/ui/settings.js. -->
        <button id="settingsBtn" class="btn-outline" type="button"
                aria-expanded="false" aria-controls="settings"
                aria-label="Settings"><svg viewBox="0 0 16 16"><use href="#g-gear"></use></svg></button>
      </div>

      <!-- What to do, in the words that match the device you are holding. It
           fades out once you are clearly walking around. See src/ui/help.js. -->
      <p id="controls" aria-live="polite"></p>

      <!-- The bottom of the world, as ONE stack. The challenge prompt sits above
           the phrase row because it is the item before it, not because of a
           hand-tuned offset: hide the phrase row and the prompt simply takes the
           bottom of the canvas, and it cannot be pushed off the screen by
           anything, because the stack is anchored to the canvas's own box. -->
      <div id="bottom">
        <!-- Walk up to somebody and this appears. There is deliberately no
             challenge button beside every name in a list: picking a fight should
             mean going to find them. -->
        <button id="nearby" class="btn" type="button" hidden></button>

        <!-- Talking: six set phrases, and no text box anywhere. See src/chat.js.
             It stays on screen whether or not anybody else is here: an empty
             space where the phrases were reads as "chat is broken", and the HUD
             already says "Just you here for now". -->
        <div id="chatbar" aria-label="Say something" hidden></div>
      </div>

      <!-- Everything that is not playing: sound, a new character, and the way
           out to the lessons. Closed until the ⚙ is pressed. -->
      <div id="settings" class="card" role="group" aria-label="Settings" hidden>
        <!-- Sound is OFF until one of these is pressed. See src/audio.js. -->
        <button id="soundBtn" class="btn-outline" type="button" aria-pressed="false">Sound: off</button>
        <button id="musicBtn" class="btn-outline" type="button" aria-pressed="false">Music: off</button>
        <!-- The hints over the world retire themselves once you have shown you
             know. This is how you get them back — for yourself, or for the
             friend you just handed the phone to. -->
        <button id="howBtn" class="btn-outline" type="button">How to play</button>
        <!-- Every look that has been won, and every look that has not been won
             yet — a wardrobe with empty spaces in it says what the next hundred
             duels are for. See src/ui/chest.js. -->
        <button id="looksBtn" class="btn-outline" type="button">Looks</button>
        <!-- The card everyone is shown once, on the first run. A child who wants
             to read it again, or a parent who wants to see it at all, has to be
             able to: it is the one piece of text here that really matters. -->
        <button id="safetyBtn" class="btn-outline" type="button">About other players</button>
        <!-- Only appears if the browser has actually offered us an install
             prompt, and never once the game is already installed. A button that
             cannot do the thing it names is worse than no button. -->
        <button id="installBtn" class="btn-outline" type="button" hidden>Install</button>
        <!-- A new name and a new animal. Asks first — see src/ui/onboarding.js. -->
        <button id="resetBtn" class="btn-outline" type="button">Start over</button>
        <!-- The map maker: a separate page, and the only place in this project
             where anybody proposes a change to it. See editor/ and PLAN.md. -->
        <a id="mapLink" class="btn-outline" href="./editor/">Make a map</a>
        <!-- Somebody was sent this link by somebody. The whole reason the game
             exists is that they could build one too, so the way to find that out
             belongs on the screen and not in a README. Quiet on purpose: it is
             the last row of a settings panel, not a call to action. -->
        <a id="learnLink" class="btn-outline" href="https://school.kakkoi.dev/ai-lessons.html"
           target="_blank" rel="noopener">Learn to build this</a>
        <!-- What this copy of the game actually is: which cached build is
             answering, which relays are open, and who this browser is to
             everybody else. It is the last row and it is deliberately dull to
             look at, because it is not for playing with — it is for the moment
             two people on two phones cannot see each other and somebody has to
             find out why, without a laptop between them. See ISSUES.md #2 and
             #3, src/build.js, and the note in src/main.js. -->
        <p id="about" class="settings-note" aria-live="polite"></p>
      </div>
    </div>

    <!-- The duel: the challenge, the three moves, and what just happened. -->
    <div id="duel" hidden></div>

    <!-- The raid: the same three moves, against somebody with ten lives, with
         everybody else who walked up to him. -->
    <div id="boss" hidden></div>

    <!-- First run only: name, then monster. Hidden the moment both are known. -->
    <div id="overlay" hidden></div>

    <!-- Shown only when a newer window of the same browser has taken the game
         over. See src/session.js. -->
    <div id="paused" hidden></div>
  </main>

  <script type="module" src="./src/main.js"></script>

  <!-- Registering the worker used to be three inline lines here, with a comment
       saying it did not deserve a module of its own. That was true while all it
       did was register. It now also has to be able to say WHICH cached build is
       answering — see src/build.js, and ISSUES.md #2, where confirming that on
       two phones is the check that would settle the whole issue. So it is a
       module, `main.js` calls it, and the same rule still holds: nothing about
       caching is allowed to stop the game starting. -->
</body>
</html>
